<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Niwot">
  <!--
    The old townofniwot.com wordmark, reduced: evergreen ground, caboose-red
    rule, serif N, in that site's own three colours. Niwot's accent was already
    drawn from this evergreen (see src/config/towns/niwot.ts); the icon was
    still the plum that scripts/new-town.ts scaffolds with, so the tab and the
    search result showed a purple N for a green town.

    Rounded to the network's icon shape rather than the old site's hard square,
    so it sits with its seven siblings; the rule is clipped to the same corner
    so it follows the bottom edge instead of overhanging it.
  -->
  <clipPath id="corner"><rect width="64" height="64" rx="12"/></clipPath>
  <g clip-path="url(#corner)">
    <rect width="64" height="64" fill="#24483A"/>
    <rect y="56" width="64" height="8" fill="#B64F3A"/>
  </g>
  <text x="32" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#FAF8F2" text-anchor="middle">N</text>
</svg>
