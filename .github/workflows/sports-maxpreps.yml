# Berthoud High sports for Inside Berthoud's /sports/ page: each followed
# team's MaxPreps home page read, the games to come checked against the
# school's own calendar, and data/berthoud/sports.json committed to main, which
# rebuilds the Berthoud site (scripts/vercel-ignore.sh). The teams are in
# src/config/berthoud-sports.ts; the rules are in scripts/sports.ts.
#
# Nothing a run cannot confirm is written: a team whose page fails keeps its
# last good entry and its date; a game the school calendar contradicts is held
# off the page. Both are in the run's summary, under "Flagged".
name: Berthoud sports (MaxPreps)

on:
  schedule:
    # Saturday 14:00 UTC: 8 am in Denver in summer, 7 am in winter, for
    # Friday night's scores. Wednesday 12:20 UTC alongside the research
    # drafts (agent-weekly.yml), for the midweek games.
    - cron: '0 14 * * 6'
    - cron: '20 12 * * 3'
  workflow_dispatch:
    inputs:
      sport:
        description: 'Probe one team instead: its MaxPreps path (football, cross-country/girls). Writes nothing; keeps the page as an artifact.'
        required: false
      calendar:
        description: 'Probe the school calendar instead: one month read and counted. Writes nothing.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sports-maxpreps
  cancel-in-progress: false

jobs:
  sports:
    name: Read MaxPreps and the school calendar, write the data file
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe one team
        if: inputs.sport != ''
        run: node scripts/sports.ts --sport=${{ inputs.sport }} --save="$RUNNER_TEMP/page.html" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the probed page
        if: always() && inputs.sport != ''
        uses: actions/upload-artifact@v4
        with:
          name: maxpreps-page
          path: ${{ runner.temp }}/page.html
          if-no-files-found: ignore
      - name: Probe the school calendar
        if: inputs.sport == '' && inputs.calendar
        run: node scripts/sports.ts --calendar | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Read and write
        if: inputs.sport == '' && !inputs.calendar
        run: |
          node scripts/sports.ts --write --summary="$RUNNER_TEMP/sports.md"
          cat "$RUNNER_TEMP/sports.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the data file
        if: inputs.sport == '' && !inputs.calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/berthoud/sports.json
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git commit -m "Berthoud sports, $(TZ=America/Denver date +%F): MaxPreps records, results and upcoming games" \
            -m "Written by the sports workflow (scripts/sports.ts) from MaxPreps, with upcoming games checked against the school calendar. The run summary lists what was held or could not be read."
          git push origin HEAD:${{ github.ref_name }}
