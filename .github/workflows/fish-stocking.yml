name: Fish stocking report (CPW)

# Colorado Parks and Wildlife adds waters to its trout stocking report every
# Friday in the fishing season. This reads it on Saturday morning and again
# on Tuesday (a report posted late, or a read that failed) into
# data/hub/fish-stocking.json, which the hub's town pages show as "Recently
# stocked near <Town>" (src/lib/fish-stocking.ts). A failed read changes
# nothing and does not fail the run: the last good file stays, and the pages
# stop showing it once it is two weeks old.

on:
  schedule:
    - cron: '10 15 * * 6'
    - cron: '10 15 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fish-stocking
  cancel-in-progress: false

jobs:
  stocking:
    name: Read CPW's stocking report, write the data file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read and write
        run: node scripts/fish-stocking.ts --write | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hub/fish-stocking.json
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git commit -m "Fish stocking report, $(TZ=America/Denver date +%F): the waters CPW has added" \
            -m "Written by the fish-stocking workflow (scripts/fish-stocking.ts) from Colorado Parks and Wildlife's trout stocking report."
          # As the sports workflow does: take what moved and push again; the
          # commit touches one data file, and this run's read is the newer.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            echo "The branch moved; taking its new commits and trying again ($attempt)."
            git pull --rebase -X theirs origin ${{ github.ref_name }}
          done
          echo "Could not push after three tries."
          exit 1
