# Drafts Thursday's email every Thursday morning and opens a pull request
# with it, so the issue is waiting to be read rather than waiting to be made,
# and merging it is the send.
#
# `npm run newsletter` writes one Markdown file per edition from the listings
# (README.md, The weekly content session, step 5), straight into
# content/hub/issues/, where a file is the issue's page in the archive. The
# pull request is the issue as it will go out: read it there (or on the hub's
# preview deployment), edit a file on the branch to add an opening line or cut
# something, and merge. The merge is a push to main that adds those files,
# and newsletter-send.yml sends each through Buttondown to its towns'
# subscribers (the owner's word, 18 October 2026: DECISIONS.md, "Merging the
# Thursday email sends it"). Close it unmerged and nothing is sent; an issue
# merged after the Friday is not sent either, because its weekend has begun,
# and the next Thursday's run replaces the pull request with its own.
#
# The body is `npm run send-newsletter -- --dry-run`: every edition, the tags
# it goes to and, once BUTTONDOWN_API_KEY is set, which have no subscribers
# yet. Opening it needs the same setting as the weekly ingest, or the
# WORKFLOW_PAT secret (DEPLOY.md).
name: Thursday drafts

on:
  schedule:
    # Thursday, 12:10 UTC: 6:10 am in Denver in summer, 5:10 am in winter,
    # after the night's content pushes and the 11:10 rebuild, before the
    # morning. The script picks the send day itself: today when today is a
    # Thursday (src/lib/newsletter.ts).
    - cron: '10 12 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: newsletter-drafts
  cancel-in-progress: false

jobs:
  draft:
    name: Draft every edition for this Thursday
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draft the editions
        id: draft
        run: |
          day="$(TZ=America/Denver date +%F)"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          npm run newsletter -- --out=content/hub/issues
      # The issues are hub pages from the merge on, so the schema has its say
      # before anyone is asked to read them.
      - run: npm run validate
      - name: What merging sends, for the pull request
        id: plan
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo '**Merging this pull request sends the email.** Every edition below goes out through Buttondown within minutes of the merge, to the subscribers tagged with its towns, and each file becomes its page in the archive at insidethetowns.com/newsletter/. Close it unmerged and nothing is sent.'
            echo
            echo 'Merge it today or tomorrow. From Saturday its weekend has started and nothing in it is sent; next Thursday'"'"'s run replaces it.'
            echo
            echo 'To change an issue first, edit its file on this branch (an opening line goes under the date line), or delete a file to hold that edition back.'
            echo
          } > "$body"
          # A run before the key is set, or an issue that cannot go, still
          # opens the pull request; the table says what would happen.
          # The files this run wrote: not yet tracked on main.
          npm run --silent send-newsletter -- --dry-run --report="$RUNNER_TEMP/plan.md" $(git ls-files --others --exclude-standard -- content/hub/issues) || true
          cat "$RUNNER_TEMP/plan.md" >> "$body" 2>/dev/null || echo 'No issue was drafted for today.' >> "$body"
          # Without the key a merge would put unsent issues in the archive, so
          # the pull request opens as a draft until it is set.
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "nokey=true" >> "$GITHUB_OUTPUT"
            printf '\n> **BUTTONDOWN_API_KEY is not set yet**, so a merge would send nothing. Add it under Settings → Secrets and variables → Actions and run this workflow again. Until then this is a draft.\n' >> "$body"
          fi
      - name: Open or update the pull request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
          branch: automation/newsletter
          delete-branch: true
          add-paths: content/hub/issues
          commit-message: "Thursday email, ${{ steps.draft.outputs.day }}: every edition, from the listings"
          title: "Thursday email, ${{ steps.draft.outputs.day }}: merge to send"
          body-path: ${{ runner.temp }}/body.md
          draft: ${{ steps.plan.outputs.nokey == 'true' }}
          labels: newsletter
      - name: Say where the issue is if the pull request could not be opened
        if: steps.pr.outcome == 'failure'
        run: |
          echo "::warning::This week's issues are on the automation/newsletter branch, but this workflow is not allowed to open a pull request. Allow it (Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests) or add a WORKFLOW_PAT secret (DEPLOY.md), then open it by hand: https://github.com/${{ github.repository }}/compare/main...automation/newsletter"
          exit 1
