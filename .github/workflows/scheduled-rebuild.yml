# Rebuilds every live site on a schedule.
#
# These are static sites, so every date-relative thing on them — "upcoming"
# events, the weekend on the hub's /this-weekend/, the "past events drop off on
# their own" promise on each town's events page — is decided at build time. A
# site that has not been rebuilt for a week is a site quietly showing last
# week's listings. Content pushes are irregular; the calendar is not.
#
# Setup, once: create a Deploy Hook on each Vercel project (Settings → Git →
# Deploy Hooks, on the production branch), then put all of them in one repo
# secret named VERCEL_DEPLOY_HOOKS, one per line, each line "<slug> <url>"
# (hub, niwot, lyons, …; a bare URL still works but cannot be matched to a
# site). Adding a town later means adding its line to that secret and nothing
# else, and the run fails loudly until that line exists: a live town with no
# hook is a site whose past events never drop off, which is the one promise
# these guides make about dates.
name: Scheduled rebuild

on:
  schedule:
    # Once a day, at 11:10 UTC: 5:10 am in Denver in summer (MDT) and 4:10 am
    # in winter (MST). Early enough that "this week", "this weekend" and the
    # day's listings have turned over before anyone reads them, late enough
    # that the night's content pushes have landed (the owner's call, 7
    # October 2026; it was 07:10 UTC before). GitHub starts scheduled runs
    # late — through early October they began 5½ to 6½ hours after the cron
    # time — and drops some altogether; the pages are written not to depend
    # on the hour (Freshness.astro).
    - cron: '10 11 * * *'
    # And once more in the Denver late morning (11:10 am MDT, 10:10 am MST),
    # so a morning's push to main, or a late start of the run above, leaves
    # the sitemaps, the noindex flags and the "Listings refreshed" date on
    # /events/ no more than half a day behind (search-visibility phase 2,
    # 15 October 2026). The browser still drops finished listings in between.
    - cron: '10 17 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    name: Trigger a deploy of every live site
    runs-on: ubuntu-latest
    steps:
      # The list of sites that must have a hook comes from the configs, so a
      # town flipped to `status: 'live'` is counted from its first night.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every project skips a push that does not touch it (scripts/vercel-ignore.sh),
      # and Vercel runs that check on a deploy hook's build too. The script tells a
      # rebuild from a push by the age of the commit: under 30 minutes old is a
      # push. So wait until main's tip is older than that, or a merge just before
      # 1 am would let a town skip its nightly rebuild.
      - name: Wait until main's tip is over 30 minutes old
        run: |
          for i in $(seq 1 120); do
            git fetch --quiet --depth=1 origin main
            age=$(( $(date +%s) - $(git log -1 --format=%ct FETCH_HEAD) ))
            [ "$age" -ge 1920 ] && { echo "main's tip is $((age / 60)) minutes old"; exit 0; }
            echo "main's tip is $((age / 60)) minutes old; waiting"
            sleep 60
          done
          echo "::warning::main kept moving for two hours; firing anyway. A town whose last push skipped it may not rebuild tonight."
      - name: Fire each deploy hook
        env:
          HOOKS: ${{ secrets.VERCEL_DEPLOY_HOOKS }}
        run: |
          if [ -z "$HOOKS" ]; then
            echo "::error::VERCEL_DEPLOY_HOOKS is not set. Every site is now only as fresh as its last push."
            exit 1
          fi
          sites="$(node scripts/live-towns.ts)"
          failed=0
          count=0
          labeled=""
          while IFS= read -r line; do
            line="$(echo "$line" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            [ -z "$line" ] && continue
            # "<slug> <url>" names the site; a bare URL is fired but cannot be matched.
            slug="$(echo "$line" | awk 'NF == 2 { print $1 }')"
            hook="$(echo "$line" | awk '{ print $NF }')"
            count=$((count + 1))
            # The hook URL is a credential: print the project, never the URL.
            name="$(echo "$hook" | sed -E 's#.*/([^/?]+).*#\1#' | cut -c1-8)"
            label="${slug:-hook $count} (…$name)"
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$hook")"
            if [ "$status" = "200" ] || [ "$status" = "201" ]; then
              echo "$label: $status"
            else
              echo "::error::$label returned $status"
              failed=1
            fi
            [ -n "$slug" ] && labeled="$labeled $slug"
          done <<< "$HOOKS"
          echo "fired $count hook(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::VERCEL_DEPLOY_HOOKS is set but contained no URLs."
            exit 1
          fi
          # Every live site needs a hook, or its past events stay up until someone pushes.
          expected="$(echo "$sites" | wc -l | tr -d ' ')"
          if [ -n "$labeled" ]; then
            for site in $sites; do
              case " $labeled " in
                *" $site "*) ;;
                *) echo "::error::$site is live and has no deploy hook in VERCEL_DEPLOY_HOOKS. Its site is not being rebuilt: past events will not drop off. Add a line \"$site <hook url>\" to the secret (DEPLOY.md, Scheduled rebuilds)."; failed=1 ;;
              esac
            done
          elif [ "$count" -lt "$expected" ]; then
            echo "::error::$expected live sites, $count deploy hooks. At least one live town is not being rebuilt; label each line \"<slug> <url>\" in VERCEL_DEPLOY_HOOKS to see which (DEPLOY.md, Scheduled rebuilds)."
            failed=1
          fi
          exit $failed

  # GitHub drops some scheduled runs altogether, and a dropped run fails
  # nothing: the weekly ingest that never starts stages nothing, and no one
  # is told. This job runs with the rebuild, twice a day, and starts again
  # any event job that has gone quiet: the weekly ingest after eight days
  # without a passing run, the nightly re-check after thirty-six hours. A job
  # whose latest run failed is not restarted: its failure opened an issue
  # (.github/actions/alert-failure), and a run that fails on its own content
  # fails again until someone fixes it. Nothing here writes to a site; a
  # started job opens its pull request as usual (1 November 2026).
  watch:
    name: Start any event job that has stopped running
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Look for a dropped ingest or re-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          check() {
            wf="$1"; max_hours="$2"; label="$3"
            last_ok="$(gh run list -R "$REPO" -w "$wf" -s success -L 1 --json createdAt -q '.[0].createdAt // ""')"
            latest="$(gh run list -R "$REPO" -w "$wf" -L 1 --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion)"')"
            if [ -n "$last_ok" ]; then hours=$(( (now - $(date -u -d "$last_ok" +%s)) / 3600 )); else hours=99999; fi
            if [ "$hours" -le "$max_hours" ]; then echo "$label: last passed ${hours} hours ago"; return; fi
            case "$latest" in
              completed/failure)
                echo "::warning::$label has not passed in ${hours} hours and its latest run failed; not restarted (see the automation-failure issue)" ;;
              completed/*|"")
                gh workflow run "$wf" -R "$REPO" --ref main
                echo "::warning::$label had not run in ${hours} hours (latest: ${latest:-none}); started it again" ;;
              *)
                echo "$label: a run is under way (${latest})" ;;
            esac
          }
          check weekly-ingest.yml 192 "The weekly ingest"
          check recheck-events.yml 36 "The nightly re-check"
