<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside the Towns — manager</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fffdf8; --ink: #1d1b17; --muted: #6b665c; --line: #e4dfd3;
    --accent: #2f6b4f; --accent-ink: #fff; --tool: #f0ede5; --warn: #b4512a; --user: #e9efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15141a; --panel: #1d1c23; --ink: #ecebe7; --muted: #9a978f; --line: #2c2b33;
      --accent: #5aa37e; --accent-ink: #0d1a13; --tool: #23222a; --warn: #e0875f; --user: #243027;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; background: var(--bg); color: var(--ink); height: 100dvh; display: grid; grid-template-columns: 260px 1fr; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 38dvh; } }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  aside h1 { font-size: 15px; margin: 0 0 8px; letter-spacing: .01em; }
  aside h1 small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button, .newbtn { font: inherit; font-size: 12.5px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); cursor: pointer; }
  .quick button:hover, .newbtn:hover { border-color: var(--accent); }
  .newbtn { width: 100%; margin-top: 8px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  #sessions { overflow: auto; padding: 8px; flex: 1; }
  #sessions a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: inherit; font-size: 13.5px; }
  #sessions a:hover { background: var(--bg); }
  #sessions a.active { background: var(--user); }
  #sessions a span { display: block; color: var(--muted); font-size: 11.5px; }
  main { display: flex; flex-direction: column; min-height: 0; }
  #topbar { padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  #status { display: inline-flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.running::before { background: var(--accent); animation: pulse 1.2s infinite; }
  #status.action::before { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }
  #topbar button { margin-left: auto; font: inherit; font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
  #feed { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 820px; padding: 12px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .msg.user { background: var(--user); align-self: flex-end; border-color: transparent; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; }
  .msg h1, .msg h2, .msg h3 { margin: .8em 0 .3em; font-size: 1.05em; } .msg h1 { font-size: 1.2em; }
  .msg ul { margin: .3em 0 .6em 1.2em; padding: 0; }
  .msg pre { background: var(--tool); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 12.5px; }
  .msg code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }
  .msg a { color: var(--accent); }
  .tool { font-size: 12.5px; color: var(--muted); max-width: 820px; }
  .tool summary { cursor: pointer; list-style: none; } .tool summary::-webkit-details-marker { display: none; }
  .tool summary::before { content: "▸ "; } .tool[open] summary::before { content: "▾ "; }
  .tool pre { background: var(--tool); color: var(--ink); padding: 8px 10px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 260px; margin: 6px 0 0; }
  .tool.err summary { color: var(--warn); }
  .approve { max-width: 820px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--warn); background: var(--panel); }
  .approve b { color: var(--warn); }
  .approve button { font: inherit; margin: 8px 8px 0 0; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .approve button.allow { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sys { font-size: 12.5px; color: var(--muted); text-align: center; padding: 6px; }
  .sys.err { color: var(--warn); }
  form { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; font: inherit; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px; max-height: 180px; }
  form button { font: inherit; padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  .empty h2 { font-size: 17px; margin: 0 0 6px; color: var(--ink); }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Inside the Towns <small>manager</small></h1>
    <div class="quick">
      <button data-q="Audit Lyons.">Audit Lyons</button>
      <button data-q="Audit every live town and give me the network summary first.">Audit all</button>
      <button data-q="Where are we with the Lyons Chamber?">Lyons Chamber</button>
      <button data-q="Who's gone quiet? Anyone I owe a reply?">Follow-ups</button>
    </div>
    <button class="newbtn" id="new">New session</button>
  </header>
  <nav id="sessions"></nav>
</aside>
<main>
  <div id="topbar"><span id="status">no session</span><span id="title"></span><button id="interrupt" hidden>Stop</button></div>
  <div id="feed">
    <div class="empty"><h2>Pick a session or start one</h2>Each session is a conversation with the manager. It keeps the repo mounted and its memory attached, so you can come back to it later.</div>
  </div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Ask the manager… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
const $ = (s) => document.querySelector(s);
const feed = $("#feed"), status = $("#status"), title = $("#title"), input = $("#input"), sendBtn = $("#send"), interruptBtn = $("#interrupt");
let current = null, es = null, seen = new Set();

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { headers: { "content-type": "application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

// --- minimal markdown (escape first, then a few constructs) ---------------
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function md(src) {
  const parts = src.split(/```/);
  return parts.map((p, i) => {
    if (i % 2 === 1) { const nl = p.indexOf("\n"); return `<pre><code>${esc(nl >= 0 ? p.slice(nl + 1) : p)}</code></pre>`; }
    let html = esc(p)
      .replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|\s)(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    // bullets
    html = html.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g, (m, block) => "\n<ul>" + block.trim().split("\n").map((l) => `<li>${l.replace(/^[-*] /, "")}</li>`).join("") + "</ul>\n");
    // paragraphs
    return html.split(/\n{2,}/).map((b) => b.trim()).filter(Boolean).map((b) => /^<(h\d|ul|pre)/.test(b) ? b : `<p>${b.replace(/\n/g, "<br>")}</p>`).join("");
  }).join("");
}

// --- rendering --------------------------------------------------------------
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function scroll() { feed.scrollTop = feed.scrollHeight; }
function textOf(content) { return (content || []).filter((b) => b.type === "text").map((b) => b.text).join(""); }

function render(e) {
  if (e.id && seen.has(e.id)) return; if (e.id) seen.add(e.id);
  switch (e.type) {
    case "user.message": feed.append(el(`<div class="msg user">${md(textOf(e.content))}</div>`)); break;
    case "agent.message": { const t = textOf(e.content); if (t.trim()) feed.append(el(`<div class="msg">${md(t)}</div>`)); break; }
    case "agent.tool_use": case "agent.mcp_tool_use": case "agent.custom_tool_use": {
      const inp = e.input || {}; const brief = inp.command || inp.path || inp.file_path || inp.url || inp.query || inp.pattern || "";
      feed.append(el(`<details class="tool" data-tool="${e.id}"><summary>${esc(e.name || "tool")}${brief ? ": " + esc(String(brief).slice(0, 120)) : ""}</summary><pre>${esc(JSON.stringify(inp, null, 2))}</pre></details>`));
      setStatus("running"); break;
    }
    case "agent.tool_result": {
      const d = feed.querySelector(`[data-tool="${e.tool_use_id}"]`); const t = textOf(e.content);
      if (d) { if (e.is_error) d.classList.add("err"); if (t) d.append(el(`<pre>${esc(t)}</pre>`)); }
      break;
    }
    case "session.status_running": setStatus("running"); break;
    case "session.status_idle": {
      const sr = e.stop_reason || {};
      if (sr.type === "requires_action") { setStatus("action"); for (const id of sr.event_ids || []) askApproval(id); }
      else if (sr.type === "budget_reached") { setStatus("idle", "budget reached"); feed.append(el(`<div class="sys err">This session hit its budget cap. Raise or remove it in the Console to continue.</div>`)); }
      else setStatus("idle");
      break;
    }
    case "session.error": feed.append(el(`<div class="sys err">Error: ${esc(e.error?.message || "unknown")}</div>`)); setStatus("idle", "error"); break;
    case "hub.error": feed.append(el(`<div class="sys err">${esc(e.message)}</div>`)); break;
    default: break;
  }
  scroll();
}
function askApproval(toolUseId) {
  const d = feed.querySelector(`[data-tool="${toolUseId}"]`); const what = d ? d.querySelector("summary").textContent : toolUseId;
  const box = el(`<div class="approve"><b>Needs your OK:</b> ${esc(what)}<br><button class="allow">Allow</button><button class="deny">Deny</button></div>`);
  box.querySelector(".allow").onclick = () => confirm(toolUseId, "allow", box);
  box.querySelector(".deny").onclick = () => confirm(toolUseId, "deny", box);
  feed.append(box);
}
async function confirm(id, result, box) { box.remove(); await api(`/sessions/${current}/confirm`, { method: "POST", body: JSON.stringify({ tool_use_id: id, result }) }); setStatus("running"); }
function setStatus(state, label) {
  status.className = state; status.textContent = label || ({ running: "working…", idle: "idle", action: "waiting for you" }[state] || state);
  interruptBtn.hidden = state !== "running";
}

// --- sessions ---------------------------------------------------------------
async function loadSessions() {
  const list = await api("/sessions");
  const nav = $("#sessions"); nav.innerHTML = "";
  for (const s of list) {
    const a = el(`<a href="#${s.id}" class="${s.id === current ? "active" : ""}">${esc(s.title || "Untitled")}<span>${new Date(s.created_at).toLocaleString()}${s.status ? " · " + esc(s.status) : ""}</span></a>`);
    a.onclick = (ev) => { ev.preventDefault(); open(s.id, s.title); };
    nav.append(a);
  }
}
async function open(id, t) {
  if (es) es.close();
  current = id; seen = new Set(); feed.innerHTML = ""; title.textContent = t || ""; setStatus("idle", "loading…");
  location.hash = id; [...$("#sessions").children].forEach((a) => a.classList.toggle("active", a.hash === "#" + id));
  // Open the live stream first, then load history, then dedupe by id.
  es = new EventSource(`/api/sessions/${id}/stream`);
  const buffer = []; let ready = false;
  es.onmessage = (m) => { const e = JSON.parse(m.data); ready ? render(e) : buffer.push(e); };
  es.onerror = () => { if (ready) setStatus("idle", "stream dropped — reload to reconnect"); };
  const history = await api(`/sessions/${id}/events`);
  for (const e of history) render(e);
  // render() sets the status from idle/running events; if history ends on
  // anything else the agent is still working, or the session is brand new.
  const last = history[history.length - 1];
  if (!last) setStatus("idle", "new session");
  else if (last.type !== "session.status_idle" && last.type !== "session.error") setStatus("running");
  ready = true; buffer.forEach(render);
}
async function newSession(firstMessage) {
  const t = firstMessage ? firstMessage.slice(0, 60) : `Manager — ${new Date().toLocaleDateString()}`;
  const s = await api("/sessions", { method: "POST", body: JSON.stringify({ title: t }) });
  await loadSessions(); await open(s.id, s.title);
  if (firstMessage) await sendMessage(firstMessage);
}
async function sendMessage(text) {
  if (!current) return newSession(text);
  render({ type: "user.message", content: [{ type: "text", text }] });
  setStatus("running"); sendBtn.disabled = true;
  try { await api(`/sessions/${current}/message`, { method: "POST", body: JSON.stringify({ text }) }); }
  catch (e) { feed.append(el(`<div class="sys err">${esc(e.message)}</div>`)); setStatus("idle"); }
  finally { sendBtn.disabled = false; }
}

// --- wiring -----------------------------------------------------------------
$("#composer").onsubmit = (ev) => { ev.preventDefault(); const t = input.value.trim(); if (!t) return; input.value = ""; input.style.height = ""; sendMessage(t); };
input.onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("#composer").requestSubmit(); } };
input.oninput = () => { input.style.height = ""; input.style.height = Math.min(input.scrollHeight, 180) + "px"; };
$("#new").onclick = () => newSession();
interruptBtn.onclick = async () => { await api(`/sessions/${current}/interrupt`, { method: "POST" }); setStatus("idle", "stopping…"); };
document.querySelectorAll(".quick button").forEach((b) => (b.onclick = () => sendMessage(b.dataset.q)));

loadSessions().then(() => { const h = location.hash.slice(1); if (h) open(h); }).catch((e) => feed.append(el(`<div class="sys err">${esc(e.message)}</div>`)));
</script>
</body>
</html>
